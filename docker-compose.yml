version: "3.9"

services:
  # ==================== Rust 后端（推荐） ====================
  eks-server:
    build:
      context: .
      dockerfile: Dockerfile.rust
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/models/bge-base-zh-v1.5:/app/models/bge-base-zh-v1.5:ro
      - ./backend/app/models/models--BAAI--bge-reranker-base:/app/models/bge-reranker-base:ro
      - ./backend/app/data:/app/data
      - ./backend/.env:/app/.env:ro
    environment:
      - RUST_LOG=info
      - EKS_CROSS_ENCODER_ONNX=/app/models/bge-reranker-base/snapshots/2cfc18c9415c912f9d8155881c133215df768a70/onnx/model.onnx
      - EKS_CROSS_ENCODER_TOKENIZER=/app/models/bge-reranker-base/snapshots/2cfc18c9415c912f9d8155881c133215df768a70/tokenizer.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==================== Python 后端（备选/过渡） ====================
  # 取消注释以同时运行 Python 后端（端口 8001）
  # backend-python:
  #   build:
  #     context: ./backend
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - ./backend/app/models:/app/app/models:ro
  #     - ./backend/app/data:/app/app/data
  #     - ./backend/.env:/app/.env:ro
  #   restart: unless-stopped

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - eks-server
    restart: unless-stopped
